[package]
name = "uncensored-persistence"
version = "0.1.0"
edition = "2021"
authors = ["Uncensored Agent"]
description = "Type-safe persistence system for uncensored agents"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.0", features = ["derive"] }
tempfile = "3.0"  # For testing

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"