[package]
name = "ggml-cpu"
description = "CPU backend for ggml, optimized for AMD Opteron 3280 (bdver1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# SIMD support behind the "simd" flag (x86_64 & aarch64)
simd = []

[dependencies]
ggml = { workspace = true }
rayon = { workspace = true }
tracing = { workspace = true }
bytemuck = { workspace = true }
half = { workspace = true }
bumpalo = { workspace = true }
thread_local = "1.1.4"
# Optional SIMD dependency
stdarch = { version = "0.2", optional = true }


[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "cpu_bench"
harness = false
