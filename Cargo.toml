[workspace]
resolver = "2"

[features]
# Feature flags for optional backends and SIMD support
default = ["cuda"]
cuda = ["ggml-cuda"]
cpu = ["ggml-cpu"]
simd = []
ui = ["llama-ui"]

[profile.release]
# Enable link‑time optimization and abort on panic for smaller, faster binaries
lto = true
panic = "abort"
members = [
    "crates/gguf",
    "crates/ggml",
    "crates/ggml-cpu",
    "crates/ggml-cuda",
    "crates/llama",
    "crates/common",
    "crates/config",
    "crates/error",
    "crates/llama-cli",
    "crates/llama-server",
    "crates/llama-ui-models",
    "crates/llama-ui-session",
    "crates/llama-ui-sandbox-client",
    "crates/llama-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jcn363/llama-rs"

[workspace.dependencies]
# Internal workspace crates
ggml = { path = "crates/ggml" }
ggml-cpu = { path = "crates/ggml-cpu" }
ggml-cuda = { path = "crates/ggml-cuda" }
gguf = { path = "crates/gguf" }
llama = { path = "crates/llama" }
common = { path = "crates/common" }
config = { path = "crates/config" }
error = { path = "crates/error" }
llama-ui-models = { path = "crates/llama-ui-models" }
llama-ui-session = { path = "crates/llama-ui-session" }
llama-ui-sandbox-client = { path = "crates/llama-ui-sandbox-client" }
llama-ui = { path = "crates/llama-ui" }

# External dependencies
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
clap = { version = "4", features = ["derive"] }
rayon = "1.5"
bytemuck = "1"
half = { version = "2.3", features = ["bytemuck"] }
bumpalo = "3"
cudarc = { version = "0.19", default-features = true }
byteorder = "1"
memmap2 = "0.9"
criterion = { version = "0.5", features = ["html_reports"] }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
proptest = "1"
nix = { version = "0.29", features = ["signal"] }

# llama-ui dependencies
reqwest = { version = "0.12", features = ["stream", "json"] }
toml = "0.5"
futures = "0.3"
tokio-stream = "0.1"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
