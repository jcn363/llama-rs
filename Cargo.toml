[workspace]
resolver = "2"
members = [
    "crates/gguf",
    "crates/ggml",
    "crates/ggml-cpu",
    "crates/ggml-cuda",
    "crates/llama",
    "crates/common",
    "crates/config",
    "crates/error",
    "crates/llama-cli",
    "crates/llama-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jcn363/llama-rs"

[workspace.dependencies]
# Internal workspace crates
ggml = { path = "crates/ggml" }
ggml-cpu = { path = "crates/ggml-cpu" }
ggml-cuda = { path = "crates/ggml-cuda" }
gguf = { path = "crates/gguf" }
llama = { path = "crates/llama" }
common = { path = "crates/common" }
config = { path = "crates/config" }
error = { path = "crates/error" }

# External dependencies
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
clap = { version = "4", features = ["derive"] }
rayon = "1.5"
bytemuck = "1"
half = { version = "2.3", features = ["bytemuck"] }
bumpalo = "3"
cudarc = { version = "0.19", default-features = true }
byteorder = "1"
memmap2 = "0.9"
criterion = { version = "0.5", features = ["html_reports"] }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
proptest = "1"
